[package]
name = "map-segments"
version = "0.1.1"
edition = "2024"
authors = ["Andre Eisenbach <git@4ae.us>"]
license = "GPL-3.0-only"
description = "Cargo subcommand to visualise ELF memory section layout against a linker memory map"
repository = "https://github.com/int2str/map-segments"
homepage = "https://github.com/int2str/map-segments"
readme = "README.md"
keywords = ["embedded", "elf", "linker", "memory", "cargo-subcommand"]
categories = ["command-line-utilities", "development-tools", "embedded"]
exclude = ["sections.out"]

[[bin]]
name = "cargo-map-segments"
path = "src/main.rs"

[dependencies]
cargo_metadata = "0.23"
clap = { version = "4.6.1", features = ["derive"] }
object = "0.39.1"
regex = "1.12"
terminal_size = "0.4"
